<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Rendición de Cuentas - Agregadurías Navales</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js para lectura de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- SheetJS para lectura/exportación de Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .navy-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
        .tab-btn { padding-bottom: 0.5rem; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-btn.active { border-bottom: 2px solid #38bdf8; color: #38bdf8; font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-blue-600 rounded-lg text-white">
                <i data-lucide="anchor" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-white">Rendición de Cuentas AA.NN.</h1>
                <p class="text-xs text-slate-400">Armada de Chile · Estado Mayor General</p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <section class="lg:col-span-4 space-y-6">
            <div class="navy-card p-5">
                <h2 class="text-base font-semibold text-slate-200 mb-4 flex items-center gap-2">
                    <i data-lucide="file-up" class="w-5 h-5 text-sky-400"></i> Carga de Archivos
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">1. Cartola HSBC (PDF)</label>
                        <input type="file" id="pdfInput" accept=".pdf" class="block w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer border border-slate-700 rounded-lg bg-slate-900/50">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">2. Caja Trimestral (.xls / .xlsx)</label>
                        <input type="file" id="excelInput" accept=".xls,.xlsx" class="block w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-600 cursor-pointer border border-slate-700 rounded-lg bg-slate-900/50">
                    </div>
                    <button onclick="procesarArchivos()" class="w-full mt-2 py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-medium rounded-lg text-sm transition">Procesar Documentos</button>
                </div>
            </div>
        </section>

        <section class="lg:col-span-8 space-y-6">
            <div class="navy-card p-5 min-h-[550px] flex flex-col">
                <div class="flex border-b border-slate-700 gap-4 text-xs font-medium mb-4 overflow-x-auto">
                    <button onclick="showTab('tabEgresos', this)" class="tab-btn active pb-2">Egresos HSBC</button>
                    <button onclick="showTab('tabIngresos', this)" class="tab-btn pb-2">Ingresos HSBC</button>
                    <button onclick="showTab('tabDesgloseCaja', this)" class="tab-btn pb-2">Matriz Caja</button>
                    <button onclick="showTab('tabTotalesGenerales', this)" class="tab-btn pb-2">Totales por Ítem</button>
                </div>

                <div class="flex justify-end gap-2 mb-4">
                    <button onclick="copiarTablaActual()" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white text-xs rounded font-medium transition">Copiar para Excel</button>
                </div>

                <div class="flex-1 overflow-x-auto">
                    <div id="tabEgresos" class="tab-content active"><table id="tableEgresos" class="w-full text-left text-xs text-slate-300"><thead><tr class="bg-slate-900/80"><th class="p-2.5">Corr.</th><th class="p-2.5">Fecha</th><th class="p-2.5">Comprobante</th><th class="p-2.5">Detalle</th><th class="p-2.5 text-right">Monto USD</th></tr></thead><tbody class="divide-y divide-slate-800"></tbody></table></div>
                    <div id="tabIngresos" class="tab-content"><table id="tableIngresos" class="w-full text-left text-xs text-slate-300"><thead><tr class="bg-slate-900/80"><th class="p-2.5">Corr.</th><th class="p-2.5">Fecha</th><th class="p-2.5">Comprobante</th><th class="p-2.5">Detalle</th><th class="p-2.5 text-right">Monto USD</th></tr></thead><tbody class="divide-y divide-slate-800"></tbody></table></div>
                    <div id="tabDesgloseCaja" class="tab-content"><table id="tableDesgloseCaja" class="w-full text-left text-xs text-slate-300"><thead id="headCajaMatriz" class="bg-slate-900/80"></thead><tbody id="bodyCajaMatriz" class="divide-y divide-slate-800"></tbody></table></div>
                    <div id="tabTotalesGenerales" class="tab-content"><table id="tableTotalesGenerales" class="w-full text-left text-xs text-slate-300"><thead><tr class="bg-slate-900/80"><th class="p-2.5">Ítem</th><th class="p-2.5">Detalle</th><th class="p-2.5 text-right">Total</th></tr></thead><tbody id="bodyTotalesGenerales" class="divide-y divide-slate-800"></tbody></table></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        let datosHsbc = { egresos: [], ingresos: [] };
        let matrizCaja = { paises: [], items: [], data: {}, totalesPais: {}, totalGeneral: 0 };
        let activeTabId = 'tabEgresos';

        function showTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            activeTabId = tabId;
        }

        async function procesarArchivos() {
            const pdfFile = document.getElementById('pdfInput').files[0];
            const excelFile = document.getElementById('excelInput').files[0];
            if (pdfFile) await leerPDF(pdfFile);
            if (excelFile) await leerExcel(excelFile);
            renderizarTodo();
        }

        async function leerPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let textLines = [];
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                let linesMap = {};
                content.items.forEach(it => {
                    let y = Math.round(it.transform[5]);
                    if (!linesMap[y]) linesMap[y] = [];
                    linesMap[y].push(it.str);
                });
                Object.keys(linesMap).sort((a,b) => b-a).forEach(y => textLines.push(linesMap[y].join(" ").trim()));
            }
            extraerHsbc(textLines);
        }

        function extraerHsbc(lines) {
            datosHsbc = { egresos: [], ingresos: [] };
            lines.forEach(line => {
                let match = line.match(/^(\d{8,10})\s+(\d{2}\s+[A-Za-z]{3}\s+\d{4})\s+(.+)$/);
                if (match) {
                    let [_, ref, fechaRaw, resto] = match;
                    let montoMatch = resto.match(/(-?[\d,]+\.\d{2})\s*$/);
                    if (montoMatch) {
                        let monto = parseFloat(montoMatch[1].replace('-', '').replace(',', ''));
                        let fechaObj = parsearFecha(fechaRaw);
                        let record = { ref, fecha: formatearFecha(fechaObj), fechaObj, detalle: resto.replace(montoMatch[1], '').trim(), monto };
                        if (montoMatch[1].includes('-')) datosHsbc.egresos.push(record);
                        else datosHsbc.ingresos.push(record);
                    }
                }
            });
            datosHsbc.egresos.sort((a,b) => a.fechaObj - b.fechaObj);
            datosHsbc.ingresos.sort((a,b) => a.fechaObj - b.fechaObj);
        }

        function parsearFecha(raw) {
            let p = raw.split(/\s+/);
            const m = {'Jan':0,'Feb':1,'Mar':2,'Apr':3,'May':4,'Jun':5,'Jul':6,'Aug':7,'Sep':8,'Oct':9,'Nov':10,'Dec':11};
            return new Date(parseInt(p[2]), m[p[1]]||0, parseInt(p[0]));
        }

        function formatearFecha(d) { return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(-2)}`; }
        function fmt(v) { return v.toFixed(2).replace('.', ','); }

        async function leerExcel(file) {
            matrizCaja = { paises: [], items: [], data: {}, totalesPais: {}, totalGeneral: 0 };
            const data = await file.arrayBuffer();
            const wb = XLSX.read(data, { type: 'array' });
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
            let h1 = rows[1] || [], h2 = rows[2] || [];
            let pTemp = [];
            for(let c=2; c<h1.length; c++) if(h1[c] && !String(h1[c]).includes('TOTALES')) pTemp.push({c, n: String(h1[c]).split('\n')[0].split('
')[0].trim()});
            pTemp.sort((a,b) => a.n.localeCompare(b.n));
            matrizCaja.paises = pTemp.map(p => p.n);
            matrizCaja.paises.forEach(p => matrizCaja.totalesPais[p] = 0);
            for(let r=3; r<rows.length; r++) {
                if(!rows[r][0] || String(rows[r][1]) == 'TOTALES') continue;
                let code = String(rows[r][0]), name = String(rows[r][1]);
                let item = {code, name, total: 0};
                matrizCaja.data[code] = {};
                pTemp.forEach(p => {
                    let v = parseFloat(rows[r][p.c]) || 0;
                    matrizCaja.data[code][p.n] = v;
                    matrizCaja.totalesPais[p.n] += v;
                    item.total += v;
                });
                matrizCaja.items.push(item);
                matrizCaja.totalGeneral += item.total;
            }
        }

        function renderizarTodo() {
            ['egresos','ingresos'].forEach(type => {
                const b = document.querySelector(`#table${type.charAt(0).toUpperCase()+type.slice(1)} tbody`);
                b.innerHTML = '';
                datosHsbc[type].forEach((it, i) => b.innerHTML += `<tr><td class="p-2">${i+1}</td><td class="p-2">${it.fecha}</td><td class="p-2 font-mono text-sky-400">${it.ref}</td><td class="p-2">${it.detalle}</td><td class="p-2 text-right">${fmt(it.monto)}</td></tr>`);
            });
            const h = document.getElementById('headCajaMatriz');
            const b = document.getElementById('bodyCajaMatriz');
            h.innerHTML = `<tr><th>ITEM</th><th>DETALLE</th>${matrizCaja.paises.map(p=>`<th class="text-right">${p}</th>`).join('')}<th>TOTAL</th></tr>`;
            b.innerHTML = matrizCaja.items.map(it => `<tr><td>${it.code}</td><td>${it.name}</td>${matrizCaja.paises.map(p=>`<td class="text-right">${fmt(matrizCaja.data[it.code][p])}</td>`).join('')}<td class="text-right font-bold">${fmt(it.total)}</td></tr>`).join('');
            document.getElementById('bodyTotalesGenerales').innerHTML = matrizCaja.items.map(it => `<tr><td>${it.code}</td><td>${it.name}</td><td class="text-right">${fmt(it.total)}</td></tr>`).join('');
        }

        function copiarTablaActual() {
            let el = document.getElementById(activeTabId === 'tabEgresos' ? 'tableEgresos' : activeTabId === 'tabIngresos' ? 'tableIngresos' : activeTabId === 'tabDesgloseCaja' ? 'tableDesgloseCaja' : 'tableTotalesGenerales');
            let range = document.createRange();
            range.selectNode(el);
            window.getSelection().addRange(range);
            document.execCommand('copy');
            alert('Copiado al portapapeles');
        }
    </script>
</body>
</html>
